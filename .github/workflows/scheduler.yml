name: Daily Ingestion Scheduler

on:
  schedule:
    # Temporarily running every 5 minutes for testing
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual triggering from GitHub UI

jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Use LTS version
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Fetch Live Data
        run: npm run fetch

      - name: Run Data Ingestion
        run: npm run ingest
        env:
          # If ingestion requires any environment variables like Groq API keys, add them here
          # GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NODE_ENV: production

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/corpus/schemes_data.json
          git commit -m "Auto-update mutual fund data [skip ci]" || echo "No changes to commit"
          git push
